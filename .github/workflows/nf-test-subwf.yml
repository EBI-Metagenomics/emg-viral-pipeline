name: nf-test for subworkflows

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  subwf-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nextflow 
        uses: nf-core/setup-nextflow@v1
        with:
          version: "25.10.0"

      - name: Setup nf-test
        uses: nf-core/setup-nf-test@v1.3.6
        with:
          install-pdiff: true

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false

      - name: Run Tests
        run: |
          nf-test test --verbose --tag subworkflows --profile docker,local --tap=test.tap --ci
          # Save the absolute path of the test.tap file to the output
          echo "tap_file_path=$(realpath test.tap)" >> $GITHUB_OUTPUT

      - name: Generate test summary
        if: always()
        shell: bash
        run: |
          # Add header if it doesn't exist (using a token file to track this)
          if [ ! -f ".summary_header" ]; then
            echo "# nf-test results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Status | Test Name | Profile |" >> $GITHUB_STEP_SUMMARY
            echo "|:------:|-----------|---------|" >> $GITHUB_STEP_SUMMARY
            touch .summary_header
          fi

          if [ -f test.tap ]; then
            while IFS= read -r line; do
              if [[ $line =~ ^ok ]]; then
                test_name="${line#ok }"
                # Remove the test number from the beginning
                test_name="${test_name#* }"
                echo "| ✅ | ${test_name} | ${{ matrix.profile }} |" >> $GITHUB_STEP_SUMMARY
              elif [[ $line =~ ^not\ ok ]]; then
                test_name="${line#not ok }"
                # Remove the test number from the beginning
                test_name="${test_name#* }"
                echo "| ❌ | ${test_name} | ${{ matrix.profile }} |" >> $GITHUB_STEP_SUMMARY
              fi
            done < test.tap
          else
            echo "| ⚠️ | No test results found | ${{ matrix.profile }} |" >> $GITHUB_STEP_SUMMARY
          fi
